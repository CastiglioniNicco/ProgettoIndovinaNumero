<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indovina il numero</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-primary text-center">
    <!-- titolo -->
    <div class="m-5 bg-white rounded-5 p-5">
        <h1>Number Guessing Game</h1>
        <i  onclick="istruzioni()" id="freccia" class="bi bi-arrow-right-circle d-inline fs-2"></i>
        <h2 class="d-inline mx-2">Istruzioni</h2>
        <p id="istruzioni" class="d-none">Il computer genera un numero casuale compreso tra 0 e 100. Tu dovrai indovinarlo. Hai a disposizione 7 tentativi.</p>
        <button onclick="inizio()" type="button" class="d-block mt-3 btn btn-primary mx-auto">Gioca</button>
    </div>

    <!-- vittoria -->
    <div id="vittoria" class="m-5 d-none bg-success text-white rounded-5 p-5 d-flex flex-column align-items-center justify-content-center">
        <h1>HAI VINTO!</h1>
        <p id="tentativiImpiegati">Hai indovinato in </p>
    </div>

    <!-- sconfitta -->
    <div id="sconfitta" class="m-5 d-none bg-danger rounded-5 text-white p-5 d-flex flex-column align-items-center justify-content-center">
        <h1>HAI PERSO!</h1>
        <p id="numero">Il numero era </p>
    </div>
    
    <!-- gioco -->
    <div id="gioco" class="m-5 p-5 d-none row justify-content-center rounded-5 bg-white">
        <!-- input -->
        <div class="d-flex justify-content-center mb-4 w-50">
            <input type="number" id="input" class="form-control input-group-number" placeholder="Inserisci un numero">
            <button onclick="gioco()" class="btn btn-primary ">Check</button>
        </div>
        
        <!-- info -->
        <div class="d-flex flex-column flex-sm-row">
            <div class="col-sm-4">
                <h3>Tentativi Rimasti</h3>
                <i class="bi bi-joystick fs-2"></i>
                <p id="tentativiRim">7</p>
            </div>
            <div class="col-sm-4">
                <h3>Suggerimenti</h3>
                <i class="bi bi-info-circle fs-2"></i>
                <p id="sugg" class="text-primary"></p>
            </div>
            <div class="col-sm-4">
                <h3>Numeri Inseriti</h3>
                <i class="bi bi-pencil-square fs-2"></i>
                <p id="provati"></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</body>
</html>
